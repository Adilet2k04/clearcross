<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClearCross – Pedestrian safety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f1b2d;--mute:#5d6b82;--line:#e3e8f0;--blue:#2563eb;--blue-s:#e8efff;
--green:#16a34a;--green-s:#e7f7ec;--amber:#d97706;--amber-s:#fef3dc;--red:#dc2626;--red-s:#fdeaea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1220;--card:#141c2e;--ink:#e8edf6;--mute:#93a1b8;--line:#243048;--blue:#5b8cff;--blue-s:#1a2747;--green:#3ecf72;--green-s:#10291b;--amber:#f2a93b;--amber-s:#33260d;--red:#ff6464;--red-s:#34161a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1220;--card:#141c2e;--ink:#e8edf6;--mute:#93a1b8;--line:#243048;--blue:#5b8cff;--blue-s:#1a2747;--green:#3ecf72;--green-s:#10291b;--amber:#f2a93b;--amber-s:#33260d;--red:#ff6464;--red-s:#34161a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--blue);display:grid;place-items:center}
.brand b{display:block;font-size:16px;letter-spacing:-.01em}.brand small{color:var(--mute);font-size:12px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:500;position:relative}
nav button:hover{background:var(--bg)}
nav button[aria-current=page]{background:var(--blue-s);color:var(--blue);font-weight:600}
nav button:focus-visible{outline:3px solid var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sys{background:var(--green-s);color:var(--green);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.sys small{display:block;font-weight:400;color:var(--mute)}
.user{display:flex;gap:10px;align-items:center;padding:6px 4px;font-size:13px}
.av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:600;font-size:12px}
.user small{display:block;color:var(--mute);font-size:12px}
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px;color:var(--mute);gap:12px;flex-wrap:wrap}
.top b{color:var(--ink);font-weight:600}
.content{padding:28px;max-width:1100px;width:100%;margin:0 auto;flex:1}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:600}
.btn:hover{filter:brightness(1.08)}.btn.green{background:var(--green)}.btn.wide{width:100%}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.safe{background:var(--green-s);color:var(--green)}.pill.caution{background:var(--amber-s);color:var(--amber)}.pill.danger{background:var(--red-s);color:var(--red)}
.pill.live{background:var(--green-s);color:var(--green)}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
/* home */
.hero{max-width:560px;margin:7vh auto 0;text-align:center;padding:44px 32px}
.hero .logo{margin:0 auto 18px;width:56px;height:56px;border-radius:16px}
.hero h1{font-size:34px}.hero p{color:var(--mute);margin:8px 0 24px}
.hero .meta{display:flex;justify-content:center;gap:20px;margin-top:24px;color:var(--mute);font-size:12.5px;flex-wrap:wrap}
/* nearby */
.cols{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.banner{background:var(--blue-s);color:var(--blue);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:600}
.banner span{display:block;font-weight:400;color:var(--mute);font-size:13px}
.cw{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:12px;padding:16px}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:700}
.ic.safe{background:var(--green-s);color:var(--green)}.ic.caution{background:var(--amber-s);color:var(--amber)}.ic.danger{background:var(--red-s);color:var(--red)}
.cw h3{margin:0;font-size:15px}.cw p{margin:2px 0 0;color:var(--mute);font-size:13px}
.link{background:none;border:0;color:var(--blue);font-weight:600;padding:6px}
.tabs{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.tabs button{border:0;background:none;border-radius:8px;padding:5px 14px;color:var(--mute);font-weight:600}
.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.side h4{margin:0 0 10px;font-size:14px}
.safer{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;background:var(--bg)}
.map{width:100%;height:auto;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:block}
.note{font-size:12.5px;color:var(--mute)}
/* details */
.back{background:none;border:0;color:var(--blue);padding:0;margin-bottom:10px;font-weight:600}
.dcols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
.state{text-align:center;padding:26px 16px}
.state .big{font-size:64px;font-weight:800;letter-spacing:.02em;line-height:1.1;margin:10px 0}
.state.danger .big{color:var(--amber)}.state.safe .big{color:var(--green)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}.row span{color:var(--mute)}.row b{font-weight:600}
/* alerts */
.alert{border-radius:18px;padding:28px;border:2px solid}
.alert.danger{background:var(--red-s);border-color:var(--red)}.alert.safe{background:var(--green-s);border-color:var(--green)}
.alert h2{font-size:clamp(30px,5vw,46px);margin:12px 0 4px;letter-spacing:-.02em;text-align:center}
.alert.danger h2{color:var(--red)}.alert.safe h2{color:var(--green)}
.alert .lead{text-align:center;color:var(--mute);margin:0 0 20px}
.chip{display:inline-block;background:var(--card);border-radius:8px;padding:5px 12px;font-weight:700;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border-radius:12px;padding:14px 16px}.tile small{color:var(--mute);display:block}.tile b{font-size:22px}
.cmd{background:var(--red);color:#fff;border-radius:14px;text-align:center;padding:22px}
.cmd b{display:block;font-size:56px;font-weight:800;line-height:1.1}
.foot{text-align:center;color:var(--mute);font-size:12.5px;margin-top:14px}
@media (max-width:900px){.cols,.dcols{grid-template-columns:1fr}}
@media (max-width:720px){
.app{grid-template-columns:1fr;padding-bottom:70px}
aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:20;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
.brand,.side-foot{display:none}nav{flex-direction:row;width:100%;justify-content:space-around}
nav button{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 10px}
.content{padding:18px 14px}.top{padding:10px 14px}.hero{padding:30px 18px}.state .big{font-size:48px}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 8h16M4 12h16M4 16h16"/></svg></div><div><b>ClearCross</b><small>Pedestrian safety</small></div></div>
  <nav aria-label="Main">
    <button data-go="home">⌂ Home</button>
    <button data-go="nearby">⌖ Nearby Crosswalks</button>
    <button data-go="alerts">△ Safety Alerts<i class="dot" id="navdot" hidden></i></button>
  </nav>
  <div class="side-foot">
    <div class="sys"><span class="pulse"></span><div>System online<small>Live sensor network</small></div></div>
    <div class="user"><div class="av">AK</div><div>Aruzhan K.<small>Pedestrian account</small></div></div>
  </div>
</aside>
<main>
  <div class="top"><span>Current area <b>Almaty Central</b></span><span>Updated just now</span></div>
  <div class="content" id="view" aria-live="polite"></div>
</main>
</div>
<script>
const CW=[
 {id:'central',name:'Central Avenue Crosswalk',dist:120,dir:'North east'},
 {id:'university',name:'University Street Crosswalk',dist:280,dir:'South'},
 {id:'abay',name:'Abay Avenue Crosswalk',dist:450,dir:'West'}
];
const SPEED=7;
const sim={phase:'approach',d:60,clear:0};
let view='home',sel='university',mode='list',monitoring=false;

function tick(){
  if(sim.phase==='approach'){sim.d-=SPEED;if(sim.d<=0){sim.phase='clear';sim.d=0;sim.clear=12}}
  else{sim.clear--;if(sim.clear<=0){sim.phase='approach';sim.d=63}}
  render();
}
function info(c){
  if(c.id!=='university')return{s:'safe',msg:'Traffic currently clear',d:null,eta:null,sig:'Walk'};
  if(sim.phase==='clear')return{s:'safe',msg:'No approaching vehicles detected',d:null,eta:null,sig:'Walk'};
  const eta=Math.max(1,Math.ceil(sim.d/SPEED));
  return{s:sim.d<=25?'danger':'caution',msg:'Vehicle detected nearby',d:sim.d,eta,sig:'Don’t Walk'};
}
const lbl={safe:'SAFE',caution:'CAUTION',danger:'WAIT'};
const ico={safe:'✓',caution:'!',danger:'!'};
const get=id=>CW.find(c=>c.id===id);

function go(v,id){view=v;if(id)sel=id;monitoring=false;location.hash=v;window.scrollTo(0,0);render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['home','nearby','details','alerts'].includes(h)&&h!==view){view=h;render()}});

function pin(c,i){const x=[205,150,70][i],y=[92,168,110][i];const s=info(c).s;
 const col={safe:'var(--green)',caution:'var(--amber)',danger:'var(--red)'}[s];
 return `<g><circle cx="${x}" cy="${y}" r="13" fill="${col}"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${i+1}</text></g>`}
function mapSvg(){return `<svg class="map" viewBox="0 0 280 230" role="img" aria-label="Map of crosswalks within 500 metres">
<rect width="280" height="230" fill="none"/>
<path d="M0 120H280M0 40H280M120 0V230M230 0V230" stroke="var(--line)" stroke-width="14" fill="none"/>
<path d="M0 120H280M120 0V230" stroke="var(--mute)" stroke-opacity=".25" stroke-width="1" stroke-dasharray="6 6" fill="none"/>
<circle cx="120" cy="120" r="9" fill="var(--blue)" stroke="#fff" stroke-width="3"/>
${CW.map(pin).join('')}
<text x="10" y="222" font-size="10" fill="var(--mute)">100 m</text><path d="M44 219H84" stroke="var(--mute)"/></svg>`}

function home(){return `<div class="card hero"><div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 8h16M4 12h16M4 16h16"/></svg></div>
<span class="pill live"><span class="pulse"></span>Live data · Almaty Central</span>
<h1 style="margin-top:14px">Stay safe at every crossing</h1>
<p>Check the current safety status of nearby crosswalks before crossing in real time.</p>
<button class="btn" data-go="nearby">Check Nearby Crosswalks</button>
<div class="meta"><span>Live sensors</span><span>Safety-first guidance</span><span>Nearby coverage</span></div></div>`}

function nearby(){
  const infos=CW.map(c=>({c,i:info(c)}));const clear=infos.filter(x=>x.i.s==='safe').length;
  const best=infos.filter(x=>x.i.s==='safe').sort((a,b)=>a.c.dist-b.c.dist)[0];
  const list=[...infos].sort((a,b)=>a.c.dist-b.c.dist).map(({c,i})=>`<div class="card cw"><div class="ic ${i.s}">${ico[i.s]}</div>
  <div><h3>${c.name} <span class="note">· ${c.dist} m away</span></h3><p><span class="pill ${i.s}">${lbl[i.s]}</span> ${i.msg}</p><p>${c.dir} from your location</p></div>
  <button class="link" data-go="details" data-id="${c.id}">View details</button></div>`).join('');
  const uni=infos.find(x=>x.c.id==='university').i;
  return `<h1>Nearby Crosswalks</h1><p class="sub">3 crosswalks found nearby</p>
  <div class="banner">${clear} of 3 nearby crossings are currently clear<span>Always look both ways and follow pedestrian signals before crossing.</span></div>
  <div class="cols"><div><div class="tabs" role="group" aria-label="View"><button data-mode="list" aria-pressed="${mode==='list'}">List</button><button data-mode="map" aria-pressed="${mode==='map'}">Map</button></div>
  ${mode==='list'?list:`<div class="card">${mapSvg()}<p class="note">1 Central Avenue · 2 University Street · 3 Abay Avenue</p></div>`}
  <p class="note">Status data refreshes automatically from roadside sensors.</p></div>
  <div class="card side"><h4>Safer option</h4>
  ${best?`<p class="note" style="margin-top:0">Based on current sensor data, ${best.c.name} is the nearest clear option.</p>
  <div class="safer"><b>${best.c.name}</b><br><span class="note">${best.c.dist} m away</span> <span class="pill safe">SAFE</span></div>
  <p class="note"><b>Why this route</b><br>${best.c.name} is currently the nearest option with clear traffic.${uni.s!=='safe'?' University Street Crosswalk has a vehicle detected nearby.':''}</p>
  <button class="btn wide" data-go="details" data-id="${best.c.id}">View details</button>`:'<p class="note">No clear crossing right now. Wait and check again.</p>'}
  <p class="note" style="margin-top:14px">Always observe pedestrian signals and surroundings before crossing.</p>
  <h4 style="margin-top:18px">Area overview</h4>${mapSvg()}<p class="note">Crosswalks within a 500 m radius</p></div></div>`;
}

function details(){
  const c=get(sel),i=info(c),safe=i.s==='safe';
  return `<button class="back" data-go="nearby">← Nearby Crosswalks</button><h1>Crosswalk Details</h1>
  <div class="dcols"><div class="card state ${safe?'safe':'danger'}">
   <h2 style="margin:0;font-size:20px">${c.name}</h2><p class="note">${c.dist} m away · <span class="pill live"><span class="pulse"></span>Sensors live</span></p>
   <span class="pill ${i.s}">${safe?'ALL CLEAR':'VEHICLE DETECTED'}</span>
   <p class="note" style="margin:14px 0 0">Recommended action</p><div class="big">${safe?'CROSS':'WAIT'}</div>
   <p class="note">${safe?'No vehicles are approaching. Look both ways and follow the pedestrian signal.':'A vehicle is approaching the crossing. Remain on the sidewalk and continue monitoring.'}</p>
   <button class="btn wide" data-monitor>${monitoring?'Monitoring… we’ll tell you when it changes':'Monitor Crossing'}</button>
   <p class="note">${safe?'Keep watching traffic while you cross.':'Stay behind the curb until the status changes to safe.'}</p></div>
  <div class="card"><h4 style="margin:0 0 4px">Live telemetry <span class="pill live" style="float:right">LIVE</span></h4><p class="note" style="margin-top:0">${c.name.replace(' Crosswalk','')} sensor feed</p>
   <div class="rows"><div class="row"><span>Pedestrian signal</span><b>${i.sig}</b></div>
   <div class="row"><span>Vehicle distance</span><b>${i.d==null?'Clear':i.d+' m'}</b></div>
   <div class="row"><span>Estimated arrival</span><b>${i.eta==null?'–':'~'+i.eta+' seconds'}</b></div>
   <div class="row"><span>Crosswalk status</span><b>${safe?'Clear':'Monitoring'}</b></div></div>
   <div class="safer"><b>Safety reminder</b><p class="note" style="margin:4px 0 0">Follow the pedestrian signal and make visual contact with drivers before entering the roadway.</p></div></div></div>`;
}

function alerts(){
  const i=info(get('university'));
  if(i.s==='safe')return `<div class="alert safe"><span class="chip" style="color:var(--green)">CROSSWALK STATUS</span> <span class="note">University Street Crosswalk · 280 m away</span>
  <h2>SAFE TO CROSS</h2><p class="lead">No approaching vehicles detected.</p>
  <div class="card" style="margin-bottom:16px"><b>Live crossing conditions</b><p class="note" style="margin:0">All monitored safety checks are clear</p>
  <div class="tiles" style="margin:12px 0 0"><div class="tile"><small>Pedestrian signal</small><b>Walk</b></div><div class="tile"><small>Vehicle status</small><b>Clear</b></div><div class="tile"><small>Crosswalk</small><b>Monitoring</b></div></div></div>
  <button class="btn green wide" data-go="nearby">Return to Nearby Crosswalks</button>
  <p class="foot">Continue to look both ways and follow the pedestrian signal while crossing.</p></div>`;
  return `<div class="alert danger"><span class="chip" style="color:var(--red)">⚠ SAFETY WARNING</span> <span class="note">University Street Crosswalk · 280 m away</span>
  <h2>VEHICLE APPROACHING</h2><p class="lead">Please wait before crossing.</p>
  <div class="tiles"><div class="tile"><small>Vehicle detected</small><b>${i.d} m away</b></div><div class="tile"><small>Estimated arrival</small><b>~${i.eta} seconds</b></div></div>
  <div class="cmd">Current instruction<b>WAIT</b>Do not enter the crosswalk yet.</div>
  <p class="foot">Monitoring continuously until the vehicle clears the crossing · Pedestrian signal: Don’t Walk</p></div>`;
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>{const on=b.dataset.go===view||(view==='details'&&b.dataset.go==='nearby');on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  document.getElementById('navdot').hidden=sim.phase!=='approach';
  const v={home,nearby,details,alerts}[view];
  const el=document.getElementById('view');
  if(view==='home'&&el.dataset.v==='home')return;
  el.dataset.v=view;el.innerHTML=v();
}
document.getElementById('view').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go,g.dataset.id);
  const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;return render()}
  if(e.target.closest('[data-monitor]')){monitoring=true;render()}
});
{const h=location.hash.slice(1);if(['home','nearby','details','alerts'].includes(h))view=h}
render();setInterval(tick,1000);
</script>
</body>
</html>
